<!-- Declaramos HTML 5-->
<!DOCTYPE html> 
<!-- "es" significa que esta en español-->
<html lang="es"> 
<!-- Datos del navegador no visibles para el usuario-->
<head> 

<!-- Declaramos caracteres especiales-->
<meta charset="UTF-8"> 
<!-- Escala adaptada a cada dispositivo-->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 

<!-- INICIO DEL CONTENIDO -->
<title> La mente humana </title>
</head>

<!-- Agregar estilos -->
<style>
    body{
        /* Convertimos en contentedor flexible */
        display: flex;
            
        /* Centra horizontalmente */
        justify-content: center; 
            
        /* Centra verticalmente */
        align-items: center; 
            
        /* body ocupa el 100% de la pantalla */
        min-height: 100vh; 
        
        /* Quita margenes por defecto */
        margin: 0;
        
        background-color: #000011;
    }
    h1{
        /* Azul Oscuro*/
        color: #00008B;
        font-family:'Times New Roman'
    }
    p{
        /* Gris*/
        color: #FFFFFF;
        font-family: 'Georgia', serif;
    }

</style>
    
    
<!-- Contenido visible-->
<body>
 
  <h1> Durante un tiempo... </h1>
  <p> Ademas </p>
  <img src="cerebro.png" alt="Ilustración como ejemplo" width="300" height="200">
  <p> Ademas </p>  



    
</body>
</html>
