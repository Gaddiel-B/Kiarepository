<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERNETIC PORTAL</title>
    <style>
        /* --- ESTILOS FUTURISTAS & ELEVADOS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000; /* Negro absoluto */
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Contenedor central flotante y estilizado */
        #main-frame {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        /* Encabezado elegante minimalista */
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #111111;
        }

        header h1 {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        header p {
            font-size: 11px;
            letter-spacing: 4px;
            color: #555555;
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* Barra de texto que pasa horizontalmente (Marquesina de datos) */
        .ticker-wrap {
            width: 100%;
            background-color: #050505;
            border-top: 1px solid #1a1a1a;
            border-bottom: 1px solid #1a1a1a;
            overflow: hidden;
            padding: 8px 0;
            margin: 20px 0;
        }

        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: marquee 25s linear infinite;
        }

        .ticker-item {
            display: inline-block;
            padding: 0 2rem;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #00f2fe; /* Color Cian Neón futurista */
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Menú Elegante de 3 pestañas */
        nav {
            margin: 30px 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        nav ul li a {
            color: #888888;
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            padding: 10px 20px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #ffffff;
            border-bottom: 1px solid #00f2fe;
        }

        /* Área de contenido del Propósito */
        main {
            margin-top: 5px;
        }

        .content-block {
            background: linear-gradient(135deg, #080808 0%, #030303 100%);
            border: 1px solid #151515;
            padding: 40px;
            border-radius: 2px;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.02);
        }

        .content-block h2 {
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 4px;
            color: #ffffff;
            margin-bottom: 20px;
            text-transform: uppercase;
            border-left: 2px solid #00f2fe;
            padding-left: 15px;
        }

        .content-block p {
            font-size: 14px;
            line-height: 1.8;
            color: #aaaaaa;
            font-weight: 300;
        }

        /* Pie de página */
        footer {
            text-align: center;
            padding: 60px 0 20px 0;
            font-size: 10px;
            letter-spacing: 2px;
            color: #333333;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="main-frame">

    <!-- Encabezado Principal -->
    <header>
        <h1>TITULO</h1>
        <p>DESCRIPCION</p>
    </header>

    <!-- Barra de Datos en Movimiento Horizontal -->
    <div class="ticker-wrap">
        <div class="ticker">
            <span class="ticker-item">// SYS.STATUS: ONLINE //</span>
            <span class="ticker-item">TITULO: DESCRIPCION</span>
            <span class="ticker-item">// TRANSMISIÓN ACTIVA //</span>
            <span class="ticker-item">TITULO: DESCRIPCION</span>
        </div>
    </div>

    <!-- Menú Reducido a 3 Secciones (Estructura de Enlaces) -->
    <nav>
        <ul>
            <li><a href="index.html" class="active">Inicio</a></li>
            <li><a href="seccion1.html">x</a></li>
            <li><a href="seccion2.html">x</a></li>
        </ul>
    </nav>

    <!-- Sección de Propósito -->
    <main>
        <div class="content-block">
            <h2>TITULO</h2>
            <p>DESCRIPCION</p>
        </div>
    </main>

    <!-- Cierre Inferior -->
    <footer>
        &copy; 2026 // TITULO // SYSTEM
    </footer>

</div>

</body>
</html>
